name: rustyView
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: $(RUSTYVIEW_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  rustyView:
    type: application
    platform: iOS
    info:
      path: rustyView/Info.plist
      properties:
        CFBundleDisplayName: rustyView
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: rustyView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RUSTYVIEW_BUNDLE_ID)
        PRODUCT_NAME: rustyView
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    scheme:
      testTargets:
        - rustyViewTests
        - rustyViewUITests
  rustyViewTV:
    type: application
    platform: tvOS
    info:
      path: rustyViewTV/Info.plist
      properties:
        CFBundleDisplayName: rustyView
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UIUserInterfaceStyle: Automatic
    sources:
      # Apple TV streams only. It shares the app's models, networking, library
      # and playback state; its own views use the focus engine and Siri Remote.
      - path: rustyView
        excludes:
          - "Views/**"
          - "RustyViewApp.swift"
          - "App/RustyViewAppDelegate.swift"
          - "Downloads/DownloadManager.swift"
          - "Downloads/DownloadManagerRuntime.swift"
          - "Info.plist"
          - "Assets.xcassets"
      - path: rustyView/Views/AuthenticatedArtworkView.swift
      - path: rustyViewTV
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RUSTYVIEW_BUNDLE_ID)
        PRODUCT_NAME: rustyView
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    scheme:
      testTargets:
        - rustyViewTVUITests
  rustyViewTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: rustyViewTVUITests
      # The same generated H.264/AAC fixture the iOS journeys use.
      - path: rustyViewUITests/Fixtures/synthetic-playback.mp4
        buildPhase: resources
    dependencies:
      - target: rustyViewTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RUSTYVIEW_BUNDLE_ID).tvuitests
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
  rustyViewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: rustyViewTests
      # Real H.264/AAC MPEG-TS segments shared with the UI journeys, served
      # as prepared HLS by the playback recovery tests.
      - path: rustyViewUITests/Fixtures/synthetic-stall-0.ts
        buildPhase: resources
      - path: rustyViewUITests/Fixtures/synthetic-stall-1.ts
        buildPhase: resources
      - path: rustyViewUITests/Fixtures/synthetic-stall-2.ts
        buildPhase: resources
    dependencies:
      - target: rustyView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RUSTYVIEW_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
  rustyViewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: rustyViewUITests
    dependencies:
      - target: rustyView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RUSTYVIEW_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
