name: rustyView
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: $(RUSTYVIEW_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  rustyView:
    type: application
    platform: iOS
    info:
      path: rustyView/Info.plist
      properties:
        CFBundleDisplayName: rustyView
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: rustyView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RUSTYVIEW_BUNDLE_ID)
        PRODUCT_NAME: rustyView
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    scheme:
      testTargets:
        - rustyViewTests
        - rustyViewUITests
  rustyViewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: rustyViewTests
    dependencies:
      - target: rustyView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RUSTYVIEW_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
  rustyViewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: rustyViewUITests
    dependencies:
      - target: rustyView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RUSTYVIEW_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
